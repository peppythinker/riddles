<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Teasers | Riddle World</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=2">
</head>
<body>
  <div class="container page-container">
    <a href="../index.html" class="back-link">← Back to Categories</a>

    <div class="page-header">
      <div class="page-emoji">🧠</div>
      <h1>Brain Teasers</h1>
      <p class="subtitle">Clever riddles to make you stop and think</p>
    </div>


    <div class="progress-text" id="progressText">Riddle 1 of 60</div>
<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

    
    <div class="riddle-card">
      <div class="riddle-label">Riddle #1</div>
      <h2 class="riddle-question">
        What has hands but cannot clap?
      </h2>

      <button class="answer-btn" onclick="toggleAnswer()">Show Answer</button>

      <div class="answer-box" id="answerBox">
        A clock.
      </div>
    </div>

  <div class="nav-row modern-nav">
  <button class="nav-btn prev" onclick="prevRiddle()">← <span>Previous</span></button>
  <button class="nav-btn shuffle modern-shuffle" onclick="shuffleRiddle()">🎲 <span>Random</span></button>
  <button class="nav-btn next" onclick="nextRiddle()"><span>Next</span> →</button>
</div>

    
  </div>

<script src="script.js"></script>

</body>
</html>
