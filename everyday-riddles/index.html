<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everyday Riddles | Riddle World</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
  <div class="container page-container">
    <a href="../index.html" class="back-link">← Back to Categories</a>

    <div class="page-header">
      <div class="page-emoji">✨</div>
      <h1>Everyday Riddles</h1>
      <p class="subtitle">Fun riddles about things you see and use every day</p>
    </div>

    <div class="riddle-card">
      <div class="riddle-label" id="riddleLabel">Everyday Riddle</div>

      <h2 class="riddle-question">Loading...</h2>

      <div class="action-row">
        <button class="answer-btn" onclick="toggleAnswer()">Show Answer</button>
        <button class="share-btn" onclick="shareRiddle()">🔗 Share Riddle</button>
      </div>

      <div class="answer-box" id="answerBox"></div>

      <div class="nav-row modern-nav">
        <button class="nav-btn prev" onclick="prevRiddle()">← <span>Previous</span></button>
        <button class="nav-btn shuffle modern-shuffle" onclick="shuffleRiddle()">🎲 <span>Random</span></button>
        <button class="nav-btn next" onclick="nextRiddle()"><span>Next</span> →</button>
      </div>

      <div class="share-status" id="shareStatus"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
